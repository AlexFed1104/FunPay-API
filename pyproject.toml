[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-api"
version = "0.1.0"
description = "Неофициальная библиотека для FunPay: чаты, лоты, заказы, профиль, отзывы, статистика"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["funpay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
